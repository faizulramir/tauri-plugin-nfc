[package]
name = "tauri-plugin-nfc"
version = "0.1.0"
description = "A Tauri v2 plugin for NFC card reading using PC/SC"
authors = ["Tauri NFC Plugin Contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/tauri-plugin-nfc"
readme = "README.md"
keywords = ["tauri", "nfc", "pcsc", "card-reader", "plugin"]
categories = ["hardware-support", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pcsc = "2.8"
tokio = { version = "1.0", features = ["full", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
log = "0.4"
anyhow = "1.0"
once_cell = "1.19"
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
# Enable additional debugging features
debug = []
# Enable mock reader for testing
mock = []